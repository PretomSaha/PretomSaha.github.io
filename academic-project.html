<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Projects | Pretom Saha</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --color-deepred: #C1121F;
      --color-darkred: #8B0000;
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 4px 6px rgba(0, 0, 0, 0.06);
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #f8f9fa;
      font-family: 'Merriweather', serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
    }

    .main-container {
      width: 100%;
      margin-top: 4rem;
      margin-bottom: 4rem;
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Main container for perfect centering */
    main.content {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }

    /* Project gallery with perfect centering */
    .project-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      max-width: 1200px;
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    /* Project cards */
    .gateway-card {
      display: flex;
      flex-direction: column;
      background-color: #fff;
      border: 1px solid #eaeaea;
      overflow: hidden;
      text-decoration: none;
      color: #222;
      transition: all 0.3s ease;
      width: 400px;
      min-height: 480px;
      position: relative;
      box-shadow: none;
      flex-shrink: 0;
    }

    .gateway-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-deepred);
    }

    .gateway-card__image-container {
      width: 100%;
      height: 250px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .gateway-card__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gateway-card__content {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .project-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2d3748;
      font-family: "Merriweather", serif;
    }

    .project-meta-row {
      display: flex;
      flex-direction: column;
      gap: 0.2em;
      margin-bottom: 1.1em;
      margin-top: 0.2em;
    }

    .meta-item {
      display: flex;
      align-items: center;
      font-size: 0.92rem;
      color: #444;
      font-family: "Merriweather", serif;
      line-height: 1.2;
      font-weight: 400;
      padding-bottom: 0.18em;
    }

    .meta-item svg {
      margin-right: 12px;
      flex-shrink: 0;
    }

    .card-bottom-row {
      display: flex;
      flex-direction: column;
      margin-top: auto;
      gap: 0.5em;
    }

    .preview-btn {
      display: inline-block;
      background-color: var(--color-deepred);
      color: #fff;
      padding: 0.75rem 1.5rem;
      text-align: center;
      font-weight: 500;
      transition: all 0.3s ease;
      border: 1px solid var(--color-deepred);
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
    }

    .preview-btn:hover {
      background-color: var(--color-darkred);
      border-color: var(--color-darkred);
      color: #fff;
    }

    .pdf-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(193, 18, 31, 0.9);
      color: white;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 500;
      z-index: 2;
    }

    .back-button {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      width: 3.2rem;
      height: 3.2rem;
      background: var(--color-deepred);
      color: #fff;
      border: 2px solid var(--color-deepred);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 16px rgba(193, 18, 31, 0.18), var(--shadow-md);
      z-index: 100;
    }

    .back-button:hover {
      background: #a00;
      box-shadow: 0 6px 24px rgba(193, 18, 31, 0.28), var(--shadow-lg);
      transform: scale(1.08);
    }

    .back-button svg {
      width: 22px;
      height: 22px;
      fill: #fff;
      stroke: #fff;
      stroke-width: 2.2;
    }

    /* Tablet styles */
    @media (max-width: 1024px) {
      main.content {
        padding: 1.5rem;
      }
      
      .project-gallery {
        max-width: 100%;
        gap: 1.5rem;
      }
    }

    /* Mobile styles */
    @media (max-width: 768px) {
      main.content {
        padding: 1rem;
      }

      .project-gallery {
      flex-direction: column;
      align-items: center;
        gap: 1.5rem;
        max-width: 100%;
      }

      .gateway-card { 
        width: 100%;
        max-width: 500px;
        min-height: 400px;
      }

      .gateway-card__image-container {
        height: 180px;
      }

      .back-button {
        display: none;
      }
    }

    /* Small mobile styles */
    @media (max-width: 480px) {
      main.content {
        padding: 0.5rem;
      }

      .project-gallery { 
        gap: 1rem;
      }

      .gateway-card {
        width: 100%;
        max-width: 400px;
        min-height: 350px;
      }

      .gateway-card__image-container {
        height: 160px;
      }

      .gateway-card__content {
        padding: 1rem;
      }

      .project-title {
        font-size: 1rem;
      }

      .preview-btn {
        font-size: 0.9rem;
        padding: 0.6rem 1.2rem;
      }

      .pdf-indicator {
        top: 8px;
        right: 8px;
        font-size: 0.7rem;
        padding: 3px 6px;
      }
    }

    @media (max-width: 1000px) {
      .main-container {
        padding-left: 2rem;
        padding-right: 2rem;
      }
    }
    @media (max-width: 700px) {
      .main-container {
        padding-left: 1rem;
        padding-right: 1rem;
        margin-top: 2rem;
        margin-bottom: 2rem;
      }
    }
  </style>
</head>

<body>
  <a href="../index.html" class="back-button" aria-label="Back to Portfolio">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: white;">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </a>

  <div class="main-container">
    <div class="project-gallery">
      <!-- Project Card 1: Bhasan Char Shoreline Dynamics -->
      <div class="gateway-card" data-pdf-src="documents/CV.pdf">
        <div class="gateway-card__image-container">
          <img src="../images/Project preview images/1.webp" alt="Shoreline Analysis of Bhasan Char" class="gateway-card__image">
        </div>
        <div class="gateway-card__content">
          <div class="project-title">Dynamics of Shoreline Changes on Bhasan Char Island</div>
          <div class="card-bottom-row">
            <div class="project-meta-row">
              <span class="meta-item" title="Year">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#C1121F" stroke-width="2"></circle><path d="M10 5v5l3 3" stroke="#C1121F" stroke-width="2" stroke-linecap="round"></path></svg>
                2022
              </span>
              <span class="meta-item" title="Course">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="10" rx="2" stroke="#C1121F" stroke-width="2"></rect><path d="M3 8h14" stroke="#C1121F" stroke-width="2"></path></svg>
                Remote Sensing and Satellite Oceanography
              </span>
            </div>
            <a href="project.html" class="preview-btn">View Project</a>
          </div>
        </div>
      </div>

      <!-- Project Card 2: Spatiotemporal Water Quality -->
      <div class="gateway-card" data-pdf-src="path/to/your/pdf2.pdf">
        <div class="gateway-card__image-container">
          <img src="../images/Project preview images/2.webp" alt="Karnaphuli River Water Quality" class="gateway-card__image">
        </div>
        <div class="gateway-card__content">
          <div class="project-title">Another Interesting Project</div>
          <div class="card-bottom-row">
            <div class="project-meta-row">
              <span class="meta-item" title="Year">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#C1121F" stroke-width="2"></circle><path d="M10 5v5l3 3" stroke="#C1121F" stroke-width="2" stroke-linecap="round"></path></svg>
                2022
              </span>
              <span class="meta-item" title="Course">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="10" rx="2" stroke="#C1121F" stroke-width="2"></rect><path d="M3 8h14" stroke="#C1121F" stroke-width="2"></path></svg>
                Remote Sensing and Satellite Oceanography
              </span>
            </div>
            <a href="#" class="preview-btn">View Project</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="../js/pdf-viewer.js"></script>
</body>
</html>
